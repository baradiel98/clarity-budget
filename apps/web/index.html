<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--CSP-->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Private, local-first budgeting. Your financial data stays on this device." />
    <meta name="theme-color" content="#F4F4F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C0D0F" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Clarity</title>
    <script src="/boot.js"></script>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <p class="boot-title">Loading Clarity…</p>
        <p class="boot-hint">Still starting… If nothing changes within 15 seconds, a details screen will explain what went wrong.</p>
        <p class="boot-build">Version %CLARITY_BUILD%</p>
      </div>
      <noscript>
        <div class="boot" style="min-height: 0">
          <p class="boot-title">JavaScript is turned off</p>
          <p class="boot-hint now">Clarity needs JavaScript. On iPhone: Settings → Apps → Safari → Advanced → turn on JavaScript, and check that no content blocker blocks this site.</p>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
