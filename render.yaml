# Render Blueprint: hosts the desktop web app as a free static site.
# In Render: New + → Blueprint → choose this repository.
services:
  - type: web
    name: clarity-budget
    runtime: static
    branch: phase-1
    buildCommand: npm ci && npm run build -w @clarity/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
